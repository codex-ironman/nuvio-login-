name: Build signed Android update
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (must be greater than every installed release)'
        required: true
        default: '2'
      version_name:
        description: 'Release version, e.g. 1.0.1'
        required: true
        default: '1.0.1'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore existing signing key
        env:
          KEYSTORE: ${{ secrets.NUVIO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "Add the original signing keystore to repository secrets before building an update."; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nuvio-manager.jks"
          chmod 600 "$RUNNER_TEMP/nuvio-manager.jks"
      - name: Build signed APK
        working-directory: android
        env:
          NUVIO_KEYSTORE_PATH: ${{ runner.temp }}/nuvio-manager.jks
          NUVIO_STORE_PASSWORD: ${{ secrets.NUVIO_STORE_PASSWORD }}
          NUVIO_KEY_PASSWORD: ${{ secrets.NUVIO_KEY_PASSWORD }}
          NUVIO_KEY_ALIAS: ${{ secrets.NUVIO_KEY_ALIAS }}
          NUVIO_VERSION_CODE: ${{ inputs.version_code }}
          NUVIO_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-manager-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version_name }}
        run: gh release create "android-v$RELEASE_VERSION" android/app/build/outputs/apk/release/app-release.apk --title "Nuvio Manager $RELEASE_VERSION" --notes "Signed Android update. Install over the previous APK."
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/nuvio-manager.jks"
